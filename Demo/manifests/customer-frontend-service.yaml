# Customer storefront - exposed externally via NodePort 30080.
# The pod's nginx reverse-proxies /api/* to backend:8080 internally, so the
# browser only talks to the NodePort (same origin) and never needs the backend
# address directly.
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: devshop-demo
  labels:
    app: customer-frontend
    app.kubernetes.io/part-of: devshop
spec:
  type: NodePort
  selector:
    app: customer-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
