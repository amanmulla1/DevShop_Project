# =============================================================================
# DevShop Demo - Kubernetes Secret (TEMPLATE - values are placeholders)
#
# The real, random values are generated by deploy.sh and applied DIRECTLY (the
# script creates the secret with kubectl, never committing real credentials).
# This file documents the EXACT keys the application requires so you know what
# the Secret must contain:
#
#   DB_USERNAME    : PostgreSQL role that backs the devshop database
#   DB_PASSWORD    : password for the above role
#   JWT_SECRET     : >= 32 characters (backend rejects shorter values)
#   ADMIN_PASSWORD : initial DevShop admin account password (auto-seeded by the
#                    backend on first startup)
#
# deploy.sh already creates this Secret for you - you normally do NOT apply
# this file by hand. It is provided for reference / manual use only.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devshop-secret
  namespace: devshop-demo
  labels:
    app.kubernetes.io/part-of: devshop
type: Opaque
stringData:
  DB_USERNAME: "devshop"
  DB_PASSWORD: "change-me-password"
  JWT_SECRET: "change-me-jwt-secret-minimum-thirty-two-bytes"
  ADMIN_PASSWORD: "ChangeMe123!"
