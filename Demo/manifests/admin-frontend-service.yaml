# Admin dashboard - exposed externally via NodePort 30081.
# /api/* is reverse-proxied to backend:8080 by the pod's nginx (same origin).
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: devshop-demo
  labels:
    app: admin-frontend
    app.kubernetes.io/part-of: devshop
spec:
  type: NodePort
  selector:
    app: admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30081
