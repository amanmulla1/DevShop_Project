apiVersion: v1
kind: ConfigMap
metadata:
  name: devshop-config
  namespace: devshop-demo
  labels:
    app.kubernetes.io/part-of: devshop
data:
  # Backend listens on 8080.
  SERVER_PORT: "8080"
  # DB_HOST is the internal PostgreSQL Service DNS name (not localhost, not an IP).
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "devshop"
  TZ: "Asia/Kolkata"
  JPA_DDL_AUTO: "update"
  JWT_EXPIRATION_MS: "86400000"
  # The frontends call the backend through their own nginx as SAME-ORIGIN /api,
  # so CORS is not exercised by the proxied requests. These origins are kept for
  # direct browser access convenience (any node IP / host DNS name).
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174"
  ADMIN_EMAIL: "admin@devshop.com"
  ADMIN_NAME: "DevShop Admin"
