apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: devshop-demo
  labels:
    app: postgres
    app.kubernetes.io/part-of: devshop
spec:
  accessModes:
    - ReadWriteOnce
  # No storageClassName specified -> the cluster's DEFAULT StorageClass is used
  # automatically (works on any standard kubeadm cluster that has one).
  resources:
    requests:
      storage: 5Gi
