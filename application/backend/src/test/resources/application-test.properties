# =============================================================================
# Test configuration — uses H2 in-memory database.
# No real PostgreSQL required to run tests.
# =============================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always

# Prometheus
management.prometheus.metrics.export.enabled=true

# JWT (test secret)
app.jwt.secret=devshop-test-secret-key-that-is-long-enough-123
app.jwt.expiration-ms=86400000

# Bootstrap Admin (test)
app.admin.email=admin@test.com
app.admin.password=TestAdmin123!
app.admin.name=Test Admin
