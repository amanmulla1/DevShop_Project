spring.datasource.url=jdbc:h2:mem:seedtestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=devshop-seed-test-secret-key-that-is-long-enough-123
app.jwt.expiration-ms=86400000

# Bootstrap Admin for the seed test (must be long enough + non-trivial)
app.admin.email=seedadmin@test.com
app.admin.password=SeedAdminPass123!
app.admin.name=Seed Admin
