# =============================================================================
# DevShop Backend — Application Configuration
# All sensitive values are read from environment variables.
# Do NOT hardcode credentials here.
# =============================================================================

# --- Server ---
server.port=${SERVER_PORT:8080}

# --- Application name (used in Actuator info and metrics) ---
spring.application.name=devshop-backend

# --- DataSource ---
# Required environment variables:
#   DB_HOST      (default: localhost)
#   DB_PORT      (default: 5432)
#   DB_NAME      (default: devshop)
#   DB_USERNAME  (no default — must be set)
#   DB_PASSWORD  (no default — must be set)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devshop}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# 'update' is safe for local dev — creates/updates schema automatically.
# In production, replace with 'validate' and manage schema externally.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# --- Actuator ---
# Expose health and prometheus endpoints.
# 'health' shows database connectivity status.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# --- Prometheus / Micrometer ---
management.prometheus.metrics.export.enabled=true

# --- Actuator base path (keep default /actuator) ---
management.endpoints.web.base-path=/actuator

# --- CORS ---
# Frontend origins allowed to call the backend API.
# Supports comma-separated list of origins.
# Override with CORS_ALLOWED_ORIGINS environment variable in non-dev environments.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174}

# --- JWT ---
# Signing secret for issued JWTs. MUST be overridden via the JWT_SECRET
# environment variable in any non-local environment (at least 32 bytes).
app.jwt.secret=${JWT_SECRET:devshop-local-dev-secret-key-change-me-please-32b}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Bootstrap Admin ---
# The initial admin account is created on startup from these environment
# variables. NEVER hardcode admin credentials.
app.admin.email=${ADMIN_EMAIL:admin@devshop.com}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
app.admin.name=${ADMIN_NAME:DevShop Admin}
