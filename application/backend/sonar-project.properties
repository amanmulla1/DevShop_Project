# =============================================================================
# DevShop Backend - SonarQube scanner configuration.
#
# Used by the Jenkins "SonarQube Analysis" stage (and local runs):
#   mvn -Pdevsecops verify sonar:sonar \
#       -Dsonar.host.url=http://<servername> -Dsonar.token=<token>
#
# projectKey must match the project created on the SonarQube server.
# =============================================================================
sonar.projectKey=devshop-backend
sonar.projectName=DevShop Backend
sonar.projectVersion=0.1.0

sonar.sources=src/main/java
sonar.tests=src/test/java

sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.junit.reportPaths=target/surefire-reports

# Fail the build when the server-side Quality Gate goes red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300