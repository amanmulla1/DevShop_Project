# =============================================================================
# DevShop — Docker Compose CI/DEPLOYMENT overlay.
#
# Used ONLY by CI/CD (Jenkins) and production deployment. It overrides the
# three application services to use PREBUILT images from a container registry
# instead of building locally, so Jenkins can deploy the exact immutable tag it
# just built and pushed.
#
# Local development is NOT affected: run `docker compose up -d --build` against
# the base docker-compose.yml (this file is not referenced).
#
# Usage (set for the command/SSH session):
#   export REGISTRY=amanmulla1
#   export IMAGE_TAG=42                      # e.g. Jenkins BUILD_NUMBER
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml pull \
#       backend customer-frontend admin-frontend
#   docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d
#
# `docker compose pull` fetches the configured registry image and does NOT build
# (the base file's build: key is ignored for pull). PostgreSQL is untouched, so
# the devshop-postgres-data volume persists across deployments.
# =============================================================================

services:
  backend:
    image: "${REGISTRY}/devshop-backend:${IMAGE_TAG}"

  customer-frontend:
    image: "${REGISTRY}/devshop-frontend:${IMAGE_TAG}"

  admin-frontend:
    image: "${REGISTRY}/devshop-admin-frontend:${IMAGE_TAG}"
