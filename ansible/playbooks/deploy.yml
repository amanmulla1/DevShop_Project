# =============================================================================
# DevShop — deploy.yml
#
# Re-deploy only (no host package changes). Use this when the EC2 public IPv4
# changes after stop/start, or when you want to pull the latest main and restart
# services without touching the server's Docker installation.
#
# It re-detects the public IP, re-renders /opt/devshop/.env (SERVER_IP / CORS),
# updates the repository and brings the compose stack back up. Idempotent.
#
# Usage (from ansible/):
#   ansible-playbook -i inventory/hosts.ini --ask-vault-pass playbooks/deploy.yml
# =============================================================================
- name: Deploy / update DevShop application
  hosts: devshop
  become: true
  gather_facts: true

  roles:
    - role: devshop
