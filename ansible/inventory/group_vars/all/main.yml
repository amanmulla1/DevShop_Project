# =============================================================================
# DevShop — group_vars/all: non-secret configuration.
#
# Sensitive values (DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD, ...) are not stored
# here. For Phase 7 they are generated ONCE by the root ./deploy.sh into a
# git-ignored, 0600 control-node store (.devshop/secrets.yml) and passed to
# Ansible via --extra-vars @<file>. None of them live in Git or are printed.
#
# A pre-encrypted vault (inventory/group_vars/all/vault.yml created with
# ansible-vault) is still supported as an alternative — see vault.yml.example.
# =============================================================================

# --- Connection ------------------------------------------------------------
# Ubuntu AMI default user. Terraform provisions Ubuntu 24.04 — user "ubuntu"
# has passwordless sudo, which the devshop role uses for docker orchestration.
ansible_user: ubuntu

# Private SSH key for connecting to EC2. Never put your .pem in Git. Provide
# the path here or override on the command line with --private-key.
# Recommended: set it per environment (e.g. in this file) to your local key.
ansible_ssh_private_key_file: "{{ lookup('env', 'DEVSHOP_SSH_KEY') | default(ssh_key_path, true) }}"
ssh_key_path: "~/.ssh/devshop.pem"

ansible_python_interpreter: /usr/bin/python3

# --- Application / repository ----------------------------------------------
project_name: devshop
devshop_repo: "https://github.com/amanmulla1/DevShop_Project.git"
devshop_branch: main
devshop_dir: /opt/devshop

# --- Database (non-secret identifiers; the password is a generated secret) ----
db_name: devshop
db_username: devshop

# User added to the docker group (Ubuntu default user on the EC2).
sysadmin_user: "{{ ansible_user }}"

# System locale / timezone mirroring the application's default (Asia/Kolkata).
system_timezone: Asia/Kolkata

# --- Server public IP ------------------------------------------------------
# Leave server_public_ip unset to AUTO-DETECT it at deploy time (recommended).
# The detected value is templated into /opt/devshop/.env as SERVER_IP and used
# to build CORS origins. No IP is hard-coded in source.
# To pin it explicitly, set it here or pass:
#   ansible-playbook ... --extra-vars "server_public_ip=203.0.113.7"
# server_public_ip: ""

# --- Base packages installed by the common role ----------------------------
common_packages:
  - curl
  - ca-certificates
  - git
  - unzip
  - gnupg
  - apt-transport-https
  - python3
  - python3-venv
