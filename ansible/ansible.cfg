# =============================================================================
# DevShop — Ansible configuration
# =============================================================================
[defaults]

# Default inventory for the project. The real hosts.ini is generated by
# scripts/generate_inventory.sh from Terraform outputs (see README). The
# committed inventory/hosts.ini.example documents the expected format.
inventory = inventory/hosts.ini

# Roles are resolved relative to this project.
roles_path = roles

# EC2 instances are provisioned per-environment and have no Elastic IP, so the
# public IPv4 can change on stop/start. SSH host key verification against the
# first-connect fingerprint is therefore skipped here for a learning/portfolio
# environment.
#
# SECURITY TRADEOFF: disabling host key checking disables verification of the
# SSH server's identity, leaving the connection susceptible to man-in-the-middle
# attacks. Do NOT use this in production. For a safer approach, first connect
# once to populate ~/.ssh/known_hosts, or pin the expected host key.
host_key_checking = False

# Do not automatically interpret Python interpreters (avoids user-space
# interpreter surprises). auto_silent warns only when a problem is found.
interpreter_python = auto_silent

# Human-friendly output.
stdout_callback = yaml
stderr_callback = yaml

# Automatic retries create *.retry files; ignore them via ansible/.gitignore.
retry_files_enabled = False

# Vault password file / id is provided at the command line (--ask-vault-pass or
# ANSIBLE_VAULT_PASSWORD_FILE). No password is stored here.

[ssh_connection]
# Use the forward_agent only if a deploy/SSH key is involved; default is fine.
# An optional private key can be passed with:
#   ansible-playbook ... --private-key /path/to/devshop.pem
# or set ansible_ssh_private_key_file in the inventory / group_vars.
