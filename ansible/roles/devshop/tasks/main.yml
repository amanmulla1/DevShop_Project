# =============================================================================
# DevShop — role: devshop
# Clones/updates the repository, detects the server public IP, renders the
# production .env (from the encrypted vault), deploys with Docker Compose, and
# verifies health. The compose stack uses `restart: unless-stopped` and a named
# persistent PostgreSQL volume, so data survives redeploys and reboots.
# =============================================================================

- name: Fail fast if the vault secrets are missing
  ansible.builtin.fail:
    msg: >
      Required secret '{{ item }}' is not defined. Create/encrypt
      inventory/group_vars/all/vault.yml (see vault.yml.example and README).
  when: item == '' or item is undefined
  loop:
    - "{{ db_password | default('') }}"
    - "{{ jwt_secret | default('') }}"
    - "{{ admin_password | default('') }}"
  no_log: true

# --- Deployment directory ----------------------------------------------------
- name: Create deployment directory
  ansible.builtin.file:
    path: "{{ devshop_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

# --- Git: clone if missing, update if present --------------------------------
# Idempotent and non-destructive: fresh clone when absent; fast-forward/update
# when present. `force: false` avoids destructive reset. Only `main` is used.
- name: Clone or update DevShop repository
  ansible.builtin.git:
    repo: "{{ devshop_repo }}"
    dest: "{{ devshop_dir }}"
    version: "{{ devshop_branch }}"
    force: false
    accept_hostkey: true
  register: git_result
  notify: Redeploy DevShop containers

# --- Detect server public IP -------------------------------------------------
# Auto-detects unless server_public_ip was pinned (e.g. --extra-vars). The
# outbound request's source IP equals the EC2 public IPv4 for this single
# public-subnet instance. No IP is hard-coded in source; it is templated into
# .env as SERVER_IP / CORS origins.
- name: Detect server public IP (auto)
  ansible.builtin.shell: "curl -fsS --max-time 10 {{ ip_detect_urls[0] }}"
  register: ip_detected
  changed_when: false
  when: server_public_ip | default('') | length == 0

- name: Set effective public IP fact
  ansible.builtin.set_fact:
    devshop_public_ip: >-
      {{ server_public_ip | default('') if (server_public_ip | default('') | length > 0) else ip_detected.stdout }}

# --- Environment file ---------------------------------------------------------
# Rendered on the host from the encrypted vault. `no_log` prevents secret
# values from appearing in task output.
- name: Render deployment .env from template
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ devshop_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Redeploy DevShop containers

# --- Apply deploy handler (only when repo or .env changed) -------------------
- name: Flush handlers (redeploy if configuration changed)
  ansible.builtin.meta: flush_handlers

# --- Health verification ------------------------------------------------------
# Uses localhost/container routing on the host (backend :8080, frontends via
# their Nginx :5173/:5174). We do not depend on the browser-facing IP from the
# host itself.
- name: Wait for backend health (actuator)
  ansible.builtin.uri:
    url: http://127.0.0.1:8080/actuator/health
  register: backend_health
  until: backend_health.status == 200
  retries: "{{ backend_health_retries }}"
  delay: "{{ backend_health_delay }}"

- name: Verify backend health endpoint
  ansible.builtin.assert:
    that:
      - backend_health.status == 200
    success_msg: "Backend actuator health: OK"

- name: Verify product API via customer frontend proxy (/api/products)
  ansible.builtin.uri:
    url: http://127.0.0.1:5173/api/products
  register: products
  retries: 10
  delay: 3
  until: products.status == 200

- name: Verify customer frontend is serving
  ansible.builtin.uri:
    url: http://127.0.0.1:5173/
  register: customer_fe
  retries: 10
  delay: 3
  until: customer_fe.status == 200

- name: Verify admin frontend is serving
  ansible.builtin.uri:
    url: http://127.0.0.1:5174/
  register: admin_fe
  retries: 10
  delay: 3
  until: admin_fe.status == 200

# Admin login endpoint availability. Credentials come from the vault; `no_log`
# prevents any secret/token from appearing in output. Only the HTTP status is
# asserted.
- name: Verify admin login endpoint (status only)
  ansible.builtin.uri:
    url: http://127.0.0.1:5174/api/auth/admin/login
    method: POST
    headers:
      Content-Type: application/json
    body_format: json
    body:
      email: "{{ admin_email }}"
      password: "{{ admin_password }}"
    status_code:
      - 200
  no_log: true
  register: admin_login

- name: Report deployment summary
  ansible.builtin.debug:
    msg:
      - "DevShop deployed at:"
      - "  Customer:  http://{{ devshop_public_ip }}:5173"
      - "  Admin:     http://{{ devshop_public_ip }}:5174"
      - "  Backend:   http://{{ devshop_public_ip }}:8080"
