# =============================================================================
# DevShop — role: devshop — defaults (lowest precedence, overridable)
# =============================================================================

# Server public IP. Empty = auto-detect at deploy time. When set, it is used
# directly (useful when pinning or when outbound detection is undesirable).
server_public_ip: ""

# Detection endpoints, tried in order when server_public_ip is not provided.
ip_detect_urls:
  - https://api.ipify.org
  - https://ifconfig.me/ip
