# =============================================================================
# DevShop — role: docker
# Installs Docker Engine + Docker Compose v2 (plugin) idempotently, and enables
# the service on boot.
#
# Compose v2 handling:
#   - If `docker compose` already provides a working Compose v2, we do NOT
#     install any additional Compose package (avoids duplicates).
#   - Only if Docker is present but Compose v2 is missing do we install the
#     matching Compose method for the engine in use (docker-ce -> the Docker
#     repo plugin; Ubuntu docker.io -> docker-compose-v2). This avoids the
#     dpkg file-conflict seen earlier (Ubuntu docker-compose-v2 vs Docker repo
#     docker-compose-plugin).
#   - If Docker itself is absent, we install the full stack from the official
#     Docker repository.
# =============================================================================

- name: Detect existing Docker engine
  ansible.builtin.shell: docker version --format '{{ "{{.Server.Version}}" }}'
  changed_when: false
  ignore_errors: true
  register: docker_detected

- name: Detect existing Docker Compose v2 (docker compose)
  ansible.builtin.shell: docker compose version --short
  changed_when: false
  ignore_errors: true
  register: compose_detected

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

# --- Install Docker Engine from the official repository (only when absent) ---
- name: Add Docker apt key (when Docker absent)
  ansible.builtin.apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    keyring: /etc/apt/keyrings/docker.gpg
    state: present
  when: docker_detected.rc != 0

- name: Add Docker apt repository (when Docker absent)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
    update_cache: true
  when: docker_detected.rc != 0

- name: Install Docker Engine + Compose plugin (when Docker absent)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
  when: docker_detected.rc != 0
  notify: Restart Docker

# --- Compose v2 only, for an engine already present but missing compose v2 ---
- name: Install Docker Compose plugin (docker-ce engine)
  ansible.builtin.apt:
    name: docker-compose-plugin
    state: present
    update_cache: true
  when:
    - docker_detected.rc == 0
    - compose_detected.rc != 0
    - "'docker.io' not in packages"
  notify: Restart Docker

- name: Install Docker Compose v2 (Ubuntu docker.io engine)
  ansible.builtin.apt:
    name: docker-compose-v2
    state: present
    update_cache: true
  when:
    - docker_detected.rc == 0
    - compose_detected.rc != 0
    - "'docker.io' in packages"
    - "'docker-compose-v2' not in packages"
  notify: Restart Docker

# --- Enable and start Docker on boot -----------------------------------------
- name: Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
    daemon_reload: true

- name: Add sysadmin user to docker group
  ansible.builtin.user:
    name: "{{ sysadmin_user }}"
    groups: docker
    append: true

- name: Verify docker engine
  ansible.builtin.command: docker --version
  changed_when: false

- name: Verify docker compose
  ansible.builtin.command: docker compose version
  changed_when: false
