# =============================================================================
# DevShop — role: kubernetes — defaults (lowest precedence, overridable)
#
# This role bootstraps a fresh EC2 host into a STANDARD single-node Kubernetes
# cluster (containerd + kubeadm + kubelet + kubectl + Calico CNI + Metrics
# Server), installs Argo CD (GitOps), applies the DevShop Secret/ConfigMap
# (outside Argo CD), then waits for Argo CD to sync the DevShop application and
# verifies health.
#
# It does NOT use K3s / MicroK8s / Minikube / Kind.
# =============================================================================

# Repository locations on the host (root-owned).
devshop_dir: /opt/devshop
devshop_state_dir: /etc/devshop/state

# Namespaces used by the cluster install.
k8s_argocd_namespace: argocd
k8s_devshop_namespace: devshop

# Public IP. Empty = auto-detect at deploy time (recommended).
server_public_ip: ""

# IP detection endpoints (tried in order when server_public_ip is empty).
ip_detect_urls:
  - https://api.ipify.org
  - https://ifconfig.me/ip

# Derived external hostnames used to reach the ingress (nip.io resolves to the IP).
# Falls back to the raw IP if a hostname library is unavailable on the host.
ingress_host_suffix: nip.io

# Health check retries / delays.
backend_health_retries: 30
backend_health_delay: 10

# Kubernetes / Argo install script behaviour (root paths in this repo).
k8s_script_dir: "{{ playbook_dir }}/../../kubernetes/scripts"
k8s_version: "1.30"
cni_pod_cidr: "10.244.0.0/16"
argocd_version: "v2.12.4"
