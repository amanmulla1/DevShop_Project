# =============================================================================
# DevShop — role: common
# Base host configuration: package prerequisites and timezone. Minimal on
# purpose — do not add unnecessary software.
# =============================================================================

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Set system timezone
  ansible.builtin.timezone:
    name: "{{ system_timezone }}"
