# =============================================================================
# DevShop - Argo CD Application for the MONITORING stack (observability)
#
# Argo CD governs all monitoring resources (Prometheus, Grafana, Alertmanager,
# node-exporter, kube-state-metrics, postgres-exporter, dashboards, rules) from
# Git (kubernetes/monitoring path). Git remains the source of truth, and Argo CD
# auto-syncs + self-heals any drift.
#
# Scope: only the `monitoring` namespace. It does NOT touch the `devshop`,
# `argocd`, or `ingress-nginx` namespaces.
#
# Secrets (grafana-admin-secret, postgres-exporter-secret) are created OUTSIDE
# Argo CD by the Ansible bootstrap and are never managed/pruned here.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/amanmulla1/DevShop_Project.git
    targetRevision: main
    path: kubernetes/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - Replace=false
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
