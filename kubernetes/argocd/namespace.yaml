# =============================================================================
# DevShop - Argo CD namespace
#
# Argo CD is installed separately from the application into its own `argocd`
# namespace. This keeps the GitOps controller isolated from the `devshop`
# application namespace. The official Argo CD install also creates this
# namespace; scripts/install-argocd.sh applies it to be explicit.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    name: argocd
    app.kubernetes.io/part-of: devshop
