# =============================================================================
# DevShop - Backend HorizontalPodAutoscaler (OPTIONAL / requires Metrics Server)
#
# K3s does NOT install Metrics Server by default. HPA scaling only works after
# Metrics Server is installed and is reporting metrics. Install it with:
#
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Then verify metrics are available:
#   kubectl top nodes
#   kubectl top pods -n devshop
#
# Do NOT claim HPA scaling works unless `kubectl get hpa -n devshop` shows
# observed metrics and the target utilization column is populated.
#
# Start lightweight on the Free Tier EC2: min 1, max 3, CPU 70%.
# =============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: devshop
  labels:
    app: backend
    app.kubernetes.io/part-of: devshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
