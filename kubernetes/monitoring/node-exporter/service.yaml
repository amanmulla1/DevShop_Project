# =============================================================================
# DevShop - node-exporter Service
#
# Declared for completeness / potential intent-based routing. Because the
# DaemonSet uses hostNetwork with hostPort 9100, Prometheus discovers the node
# directly via kubernetes_sd role:node. This Service is optional but kept so the
# monitoring stack is self-documenting and works if hostNetwork is disabled.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring
  labels:
    app: node-exporter
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app: node-exporter
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
