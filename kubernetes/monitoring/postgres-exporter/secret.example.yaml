# =============================================================================
# DevShop - postgres-exporter Secret (EXAMPLE - NOT a real secret)
#
# The REAL secret.yaml holds the PostgreSQL DSN (which embeds the DB password).
# It is rendered by Ansible OUTSIDE Argo CD from the git-ignored
# .devshop/secrets.yml store + group_vars db_username, and is git-ignored
# (see .gitignore), so it is never committed. Argo CD does NOT manage it (it is
# not in the kustomize resources list) and never prunes it.
#
# This example only documents the expected shape. Placeholders only - no real
# credentials. Do NOT commit a real secret here.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: monitoring
type: Opaque
stringData:
  DATA_SOURCE_NAME: "postgresql://USER:PASSWORD@postgres.devshop:5432/devshop?sslmode=disable"
