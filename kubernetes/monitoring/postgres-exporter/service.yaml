# =============================================================================
# DevShop - postgres-exporter Service
#
# Prometheus scrapes postgres-exporter at postgres-exporter.monitoring:9187 via
# kubernetes_sd role:endpoints. Not exposed publicly.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app: postgres-exporter
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app: postgres-exporter
  ports:
    - name: http
      port: 9187
      targetPort: 9187
