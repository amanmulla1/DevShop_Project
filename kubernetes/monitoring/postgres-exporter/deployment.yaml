# =============================================================================
# DevShop - postgres-exporter Deployment
#
# Exposes PostgreSQL metrics (connections, transactions, tuples, cache hit,
# locks, size, deadlocks) in Prometheus format. It connects to the DevShop
# PostgreSQL Service (postgres.devshop:5432) using the SAME credentials the app
# uses.
#
# The DATA_SOURCE_NAME (DSN) contains the DB password and is therefore NOT in
# Git. It is rendered by the Ansible bootstrap into the
# postgres-exporter-secret Secret (monitoring namespace) - same pattern as the
# devshop-secret. See secret.example.yaml for the shape.
#
# No HA/replication claims: the DevShop DB is a single instance; we monitor the
# live primary metrics only.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: monitoring
  labels:
    app: postgres-exporter
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: postgres-exporter
          image: prometheuscommunity/postgres-exporter:v0.15.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_SOURCE_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: DATA_SOURCE_NAME
            - name: PG_EXPORTER_DISABLE_DEFAULT_METRICS
              value: "false"
            - name: PG_EXPORTER_EXTEND_QUERY_PATH
              value: /etc/postgres_exporter/queries.yaml
          ports:
            - name: http
              containerPort: 9187
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: queries
              mountPath: /etc/postgres_exporter
              readOnly: true
              subPath: queries.yaml
      volumes:
        - name: queries
          configMap:
            name: postgres-exporter-queries
