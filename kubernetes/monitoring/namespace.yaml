# =============================================================================
# DevShop - monitoring namespace
#
# All observability components (Prometheus, Grafana, Alertmanager, exporters)
# live in their own `monitoring` namespace - separate from the `devshop`
# application namespace and the `argocd` namespace. Keeping monitoring isolated
# means an application issue or a monitoring issue can be investigated
# independently, and monitoring resources never clash with application resources.
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
