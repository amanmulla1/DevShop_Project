# =============================================================================
# DevShop - Prometheus RECORDING + ALERT RULES
#
# Mounted at /etc/prometheus/rules/ as alerts.yml and recording.yml (see the
# Prometheus Deployment volumeMount and the rule_files block in prometheus.yml).
#
# All rule/alert severity labels are meaningful: critical / warning / info.
# Thresholds are tuned for a small single-node cluster so we do not create
# alert storms. Rule comments document condition, duration, threshold,
# severity, meaning and recommended operator action.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
data:
  recording.yml: |
    groups:
      # --- DevShop application request/error/latency (uses the requests histogram) ---
      - name: devshop-http
        interval: 30s
        rules:
          # Request rate (req/s) split by HTTP status over the last 5m.
          - record: devshop:http_requests:rate5m
            expr: |
              sum by (namespace, pod, status) (
                rate(http_server_requests_seconds_count[5m])
              )
          # 5xx error rate (req/s) over the last 5m.
          - record: devshop:http_errors_5xx:rate5m
            expr: |
              sum by (namespace, pod) (
                rate(http_server_requests_seconds_count{status=~"5.."}[5m])
              )
          # P50/P95/P99 request latency from the histogram over 5m.
          - record: devshop:http_request_duration_seconds:p50
            expr: |
              histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
          - record: devshop:http_request_duration_seconds:p95
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))
          - record: devshop:http_request_duration_seconds:p99
            expr: |
              histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))

      # --- Kubernetes node / cluster utilisation (cAdvisor-based) --------------
      - name: kubernetes-utilization
        interval: 30s
        rules:
          # Node CPU utilisation percent = container CPU over machine CPU cores.
          - record: node:cluster:cpu_utilization:percent
            expr: |
              sum(rate(container_cpu_usage_seconds_total{image!="",container!=""}[5m])) /
              sum(machine_cpu_cores) * 100
          # Node memory utilisation percent = working set over machine memory.
          - record: node:cluster:memory_utilization:percent
            expr: |
              sum(container_memory_working_set_bytes{image!="",container!=""}) /
              sum(machine_memory_bytes) * 100

      # --- PostgreSQL -----------------------------------------------------------
      - name: devshop-postgres
        interval: 30s
        rules:
          # Connection utilisation (%) = active backends / max_connections.
          - record: devshop:postgres:connection_utilization:percent
            expr: |
              pg_stat_database_numbackends /
              (pg_settings_max_connections / 1) * 100
          # Cache hit ratio (%) = blks_hit / (blks_hit + blks_read).
          - record: devshop:postgres:cache_hit_ratio:percent
            expr: |
              sum(pg_stat_database_blks_hit) /
              (sum(pg_stat_database_blks_hit) + sum(pg_stat_database_blks_read)) * 100

  alerts.yml: |
    groups:
      # ===================== INFRASTRUCTURE (node-exporter) ======================
      - name: infra
        interval: 30s
        rules:
          # Node down: exporter reports up==0 for 5m.
          - alert: NodeDown
            expr: up{job="node-exporter"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is down"
              description: "The EC2 node exporter has been unreachable for 5m."
              action: "Check SSH reachability, instance state (stop? terminated?), and node-exporter pod."

          # High CPU sustained - small single node, so 95%+ for 15m is meaningful.
          - alert: HighNodeCPU
            expr: |
              node:cluster:cpu_utilization:percent > 95
            for: 15m
            labels:
              severity: warning
            annotations:
              summary: "Node CPU high ({{ $value }}%)"
              description: "Sustained high CPU on the single EC2 node for 15m."
              action: "Check for noisy neighbours / runaway pods. Consider scaling or HPA."

          # Low disk - root filesystem at 85% for 15m.
          - alert: LowDiskSpace
            expr: |
              (node_filesystem_avail_bytes{fstype=~"(ext4|xfs)",mountpoint="/"} /
               node_filesystem_size_bytes{fstype=~"(ext4|xfs)",mountpoint="/"}) * 100 < 15
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: "Low disk on {{ $labels.instance }}"
              description: "Root filesystem is below 15% free on the node."
              action: "Purge old images/logs, expand root volume, or set a shorter Prometheus retention."

      # ===================== KUBERNETES (kube-state-metrics / cAdvisor) ===========
      - name: kubernetes
        interval: 30s
        rules:
          # Node NotReady (control-plane / single node damaged).
          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} is NotReady"
              description: "A cluster node has not been Ready for 10m; the whole cluster may be affected."
              action: "SSH to the node, check kubelet/containerd, drains issues, and node health."

          # Failed pods present for 10m.
          - alert: PodFailed
            expr: kube_pod_status_phase{phase="Failed"} > 0
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} failed"
              description: "A pod in phase Failed has persisted for 10m."
              action: "kubectl describe pod -n {{ $labels.namespace }} {{ $labels.pod }}; check logs and init containers."

          # Deployment with unavailable replicas (0 available of desired > 0) for 5m.
          - alert: DeploymentUnavailable
            expr: |
              kube_deployment_status_replicas_available <
              kube_deployment_spec_replicas and kube_deployment_spec_replicas > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Deployment {{ $labels.deployment }} has unavailable replicas"
              description: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} cannot reach desired replicas."
              action: "Check rollout status and pod logs; roll back the image tag if it is a bad deploy."

          # Pod crash-looping (restart count climbing) - OOMKill / CrashLoopBackOff.
          - alert: KubePodCrashLooping
            expr: |
              increase(kube_pod_container_status_restarts_total[10m]) > 3
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.pod }} is crash-looping"
              description: "Container {{ $labels.container }} restarted >3 times in 10m."
              action: "kubectl logs -n {{ $labels.namespace }} {{ $labels.pod }} --previous; check OOMKilled / exceptions."

          # OOMKilled containers.
          - alert: OOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} was OOMKilled"
              description: "Container terminated by the OOM killer."
              action: "Raise memory limits/requests or investigate leak; check container_memory_working_set_bytes."

      # ===================== APPLICATION (DevShop Micrometer) =====================
      - name: devshop-application
        interval: 30s
        rules:
          # Backend process down (Micrometer up/process metrics missing).
          - alert: DevShopBackendDown
            expr: |
              up{job="devshop-backend"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "DevShop backend is unreachable"
              description: "Prometheus cannot scrape the backend /actuator/prometheus for 5m."
              action: "Check backend pod status, readiness, and that /actuator/prometheus responds."

          # High 5xx rate sustained.
          - alert: DevShopHighErrorRate
            expr: |
              sum(devshop:http_errors_5xx:rate5m) > 0.5
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "DevShop 5xx rate elevated"
              description: "Backend is returning more than 0.5 5xx responses/sec for 10m."
              action: "Check backend logs and the Application dashboard, drill into failing endpoints."

      # ===================== POSTGRESQL (postgres-exporter) =======================
      - name: devshop-postgres
        interval: 30s
        rules:
          # PostgreSQL exporter / DB down.
          - alert: PostgreSQLDown
            expr: up{job="postgres-exporter"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL exporter/unreachable"
              description: "Prometheus cannot reach the postgres-exporter for 5m."
              action: "Check postgres-exporter pod and the postgres deployment."

          # Connection utilisation over 85% of max_connections.
          - alert: PostgreSQLHighConnections
            expr: devshop:postgres:connection_utilization:percent > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL connection pressure ({{ $value }}%)"
              description: "Connection utilisation above 85% for 10m."
              action: "Check HikariCP pool sizing/total; investigate connection leaks; check for stalled queries."
