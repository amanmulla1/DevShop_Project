# =============================================================================
# DevShop - Prometheus configuration
#
# Kubernetes-native service discovery (kubernetes_sd_configs) is used for every
# target. No static pod IPs are listed, so targets survive pod/IP changes and
# there is nothing to manually edit. The Prometheus ServiceAccount token
# (bearer_token_file) is used to authenticate to the Kubernetes API / kubelet
# proxy for control-plane, kubelet and cAdvisor metrics.
#
# Retention: 15 days (low-cost single node; NOT unlimited).
#   --storage.tsdb.retention.time=15d (see the Prometheus Deployment args)
#
# Scrape targets:
#   - DevShop backend        /actuator/prometheus   (kubernetes_sd role: endpoints)
#   - Kubernetes API server  /metrics               (static, via in-cluster API)
#   - kubelet                /metrics               (role: node, via kubelet proxy)
#   - cAdvisor (containers)  /metrics/cadvisor      (role: node, via kubelet proxy)
#   - kube-state-metrics     /metrics               (role: endpoints)
#   - node-exporter          /metrics               (role: node, port 9100)
#   - postgres-exporter      /metrics               (role: endpoints)
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
      external_labels:
        cluster: devshop
        environment: aws

    # Only local storage is used - no remote_write / remote_read.
    rule_files:
      - /etc/prometheus/rules/alerts.yml
      - /etc/prometheus/rules/recording.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["alertmanager.monitoring:9093"]

    scrape_configs:
      # --- DevShop Spring Boot backend /actuator/prometheus (Micrometer) -----
      # Prometheus is injected with an Envoy sidecar so it can reach this port
      # over mTLS; no special auth config is needed here.
      - job_name: devshop-backend
        honor_labels: true
        metrics_path: /actuator/prometheus
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - devshop
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__address__]
            target_label: instance

      # --- Istio mesh telemetry (Envoy sidecar /stats/prometheus) -----------
      # Scrape every sidecar's envoy stats endpoint on port 15090. These are
      # plaintext Prometheus stats (not Envoy metrics to be mTLS-encrypted) and
      # cover the core istio_requests_*, istio_tcp_* request counters used by
      # the Istio Grafana dashboards.
      - job_name: istio-mesh
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - devshop
                - monitoring
                - istio-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: "http-envoy-prom"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace

      # --- istiod (Pilot) telemetry + debug metrics ----------------------------
      - job_name: istiod
        honor_labels: true
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name]
            action: keep
            regex: istiod
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: "http-monitoring"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__address__]
            target_label: instance

      # --- Kubernetes API server control-plane metrics -------------------------
      - job_name: kubernetes-apiserver
        scheme: https
        tls_config:
          insecure_skip_verify: true
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - default
        relabel_configs:
          - action: keep
            regex: kubernetes
            source_labels: [__meta_kubernetes_service_name]

      # --- kubelet (control-plane + node health) via kubelet proxy ------------
      - job_name: kubernetes-kubelet
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __address__
            replacement: ${1}:10250
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # --- cAdvisor (container/pod resource metrics) via kubelet metrics port ---
      - job_name: kubernetes-cadvisor
        scheme: https
        tls_config:
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        metrics_path: /metrics/cadvisor
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __address__
            replacement: ${1}:10250
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: node

      # --- kube-state-metrics (cluster object state) ---------------------------
      - job_name: kube-state-metrics
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - action: keep
            regex: kube-state-metrics
            source_labels: [__meta_kubernetes_service_name]
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            source_labels: [__address__]
            target_label: instance
          - action: labelmap
            regex: __meta_kubernetes_namespace
            replacement: namespace

      # --- Node exporter (EC2 host / node infrastructure) ----------------------
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: node
          - action: replace
            source_labels: [__meta_kubernetes_node_name]
            target_label: __address__
            replacement: ${1}:9100

      # --- PostgreSQL exporter ---------------------------------------------------
      - job_name: postgres-exporter
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - monitoring
        relabel_configs:
          - action: keep
            regex: postgres-exporter
            source_labels: [__meta_kubernetes_service_name]
          - action: replace
            source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - action: replace
            source_labels: [__address__]
            target_label: instance
