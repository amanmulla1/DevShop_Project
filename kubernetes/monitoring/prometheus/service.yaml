# =============================================================================
# DevShop - Prometheus Service (internal ClusterIP)
#
# Exposed only inside the cluster (Grafana reaches it at prometheus:9090).
# Prometheus is NOT exposed publicly - use kubectl port-forward to view the UI:
#   kubectl -n monitoring port-forward svc/prometheus 9090:9090
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
