# =============================================================================
# DevShop - Prometheus ServiceAccount
#
# Given cluster read access so Prometheus can use kubernetes_sd_configs and
# scrape the API server, kubelet and cAdvisor via the kubelet proxy. Least
# privilege: read-only over nodes, services, endpoints, pods, namespaces and
# the ability to proxy to nodes (for kubelet/cAdvisor metrics).
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
