# =============================================================================
# DevShop - Grafana admin Secret (EXAMPLE - NOT a real secret)
#
# The REAL secret.yaml is rendered by Ansible OUTSIDE Argo CD from the git-
# ignored .devshop/secrets.yml store, and is git-ignored (see .gitignore), so
# it is never committed and never appears in Git. Argo CD does NOT manage it
# (it is not in the kustomize resources list), so it is never pruned.
#
# This example only documents the expected shape. Placeholders only - no real
# credentials. Do NOT commit a real secret here.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-secret
  namespace: monitoring
type: Opaque
stringData:
  GF_SECURITY_ADMIN_USER: "admin"
  GF_SECURITY_ADMIN_PASSWORD: "<generated-by-ansible>"
