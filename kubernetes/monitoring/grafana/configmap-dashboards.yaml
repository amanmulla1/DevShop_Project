# =============================================================================
# DevShop - Grafana dashboards (auto-provisioned from Git)
#
# The seven DevShop dashboards below are mounted at /var/lib/grafana/dashboards
# and referenced by the dashboard-provider ConfigMap (which assigns folders).
# Grafana provisioning loads them automatically on boot - no manual import.
#
# The dashboards are also maintained as individual readable JSON files in
# kubernetes/monitoring/grafana/dashboards/ for review. This ConfigMap is the
# single mounted source of truth for the running Grafana.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
data:
  overview.json: |
    {
      "title": "DevShop Executive Overview",
      "uid": "devshop-overview",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "overview"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": false
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overall Status",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Backend",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"devshop-backend\"}", "legendFormat": "status", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "PostgreSQL",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"postgres-exporter\"}", "legendFormat": "status", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Grafana",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"kube-state-metrics\"}", "legendFormat": "kstate", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Nodes Ready",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "ready", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Running Pods",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "running", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 0 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Unavailable Replicas",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_deployment_status_replicas - kube_deployment_status_replicas_available)", "legendFormat": "unavailable", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 2 }
                ]
              }
            },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Key KPIs",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Requests / sec",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count[5m]))", "legendFormat": "req/s", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 500 } ] } },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Error %",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) * 100", "legendFormat": "errors %", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "percent", "max": 100, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "P95 Latency",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le))", "legendFormat": "P95", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1.5 } ] } },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Backend Uptime",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "time() - process_start_time_seconds", "legendFormat": "uptime", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s", "color": { "mode": "palette-classic" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null } ] } },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "DB Active Connections",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_database_numbackends", "legendFormat": "connections", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 90 } ] } },
            "overrides": []
          },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 14,
          "type": "row",
          "title": "Resource Utilisation",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Node CPU & Memory Utilisation",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU {{instance}}", "refId": "A" },
            { "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "Mem {{instance}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Requests / sec (by status)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (status) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{status}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 17,
          "type": "row",
          "title": "Recent Problems",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Pod Restarts",
          "gridPos": { "h": 6, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "increase(kube_pod_container_status_restarts_total[15m])", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 19,
          "type": "timeseries",
          "title": "DB Connection Utilisation %",
          "gridPos": { "h": 6, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_database_numbackends / (pg_settings_max_connections / 1) * 100", "legendFormat": "util %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 60 }, { "color": "red", "value": 85 } ] } }, "overrides": [] }
        }
      ]
    }

  kubernetes.json: |
    {
      "title": "DevShop Kubernetes Cluster Overview",
      "uid": "devshop-kubernetes",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          },
          {
            "name": "node",
            "label": "Node",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Nodes",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Nodes Ready",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"})", "legendFormat": "ready", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 0 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Nodes NotReady",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 0)", "legendFormat": "notready", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Allocatable CPU (cores)",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "cpu", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Allocatable Memory (GiB)",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_node_status_allocatable{resource=\"memory\"}) / 1073741824", "legendFormat": "GiB", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "deckbytes", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Cluster Workloads",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Total Pods",
          "gridPos": { "h": 4, "w": 3, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_info)", "legendFormat": "pods", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 8,
          "type": "stat",
          "title": "Running",
          "gridPos": { "h": 4, "w": 3, "x": 3, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{phase=\"Running\"})", "legendFormat": "running", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 9,
          "type": "stat",
          "title": "Pending",
          "gridPos": { "h": 4, "w": 3, "x": 6, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{phase=\"Pending\"})", "legendFormat": "pending", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 10,
          "type": "stat",
          "title": "Failed",
          "gridPos": { "h": 4, "w": 3, "x": 9, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_pod_status_phase{phase=\"Failed\"})", "legendFormat": "failed", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Namespaces",
          "gridPos": { "h": 4, "w": 3, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_namespace_status_phase{phase=\"Active\"})", "legendFormat": "ns", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Deployments",
          "gridPos": { "h": 4, "w": 3, "x": 15, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "count(kube_deployment_spec_replicas)", "legendFormat": "deps", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 13,
          "type": "row",
          "title": "Resource Utilisation (cAdvisor / cluster)",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 10 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Cluster CPU Utilisation %",
          "gridPos": { "h": 7, "w": 8, "x": 0, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(container_cpu_usage_seconds_total{image!=\"\",container!=\"\"}[5m])) / sum(machine_cpu_cores) * 100", "legendFormat": "CPU %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 15,
          "type": "timeseries",
          "title": "Cluster Memory Utilisation %",
          "gridPos": { "h": 7, "w": 8, "x": 8, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(container_memory_working_set_bytes{image!=\"\",container!=\"\"}) / sum(machine_memory_bytes) * 100", "legendFormat": "Mem %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Requested vs Capacity CPU",
          "gridPos": { "h": 7, "w": 8, "x": 16, "y": 11 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(kube_pod_container_resource_requests{resource=\"cpu\"})", "legendFormat": "requested", "refId": "A" },
            { "expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})", "legendFormat": "capacity", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 17,
          "type": "table",
          "title": "Unavailable / Desired Replicas by Deployment",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_deployment_status_replicas_available - kube_deployment_spec_replicas", "legendFormat": "unavailable", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 3 } ] },
              "custom": { "align": "auto", "filterable": false }
            },
            "overrides": []
          },
          "transformations": []
        },
        {
          "id": 18,
          "type": "table",
          "title": "Pod Status by Namespace",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (namespace, phase) (kube_pod_status_phase)", "legendFormat": "{{namespace}} {{phase}}", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": false } }, "overrides": [] },
          "transformations": []
        }
      ]
    }

  infrastructure.json: |
    {
      "title": "DevShop EC2 / Node Infrastructure",
      "uid": "devshop-infrastructure",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "infrastructure", "node"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "instance",
            "label": "Instance",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(node_uname_info, instance)",
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Host Summary",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Uptime",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "time() - node_boot_time_seconds", "legendFormat": "uptime", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "CPU Utilisation %",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 95 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Memory Utilisation %",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100", "legendFormat": "Mem %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 95 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Root Disk Utilisation %",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "(1 - (node_filesystem_avail_bytes{fstype=~\"ext4|xfs\",mountpoint=\"/\"} / node_filesystem_size_bytes{fstype=~\"ext4|xfs\",mountpoint=\"/\"})) * 100", "legendFormat": "Disk %", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 80 }, { "color": "red", "value": 90 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 6,
          "type": "row",
          "title": "CPU",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU Breakdown (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (mode) (rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) / on() sum(rate(node_cpu_seconds_total[5m])) * 100", "legendFormat": "{{mode}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Load Average (1m / 5m / 15m)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "node_load1", "legendFormat": "load1", "refId": "A" },
            { "expr": "node_load5", "legendFormat": "load5", "refId": "B" },
            { "expr": "node_load15", "legendFormat": "load15", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Memory",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Memory Usage",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes", "legendFormat": "used", "refId": "A" },
            { "expr": "node_memory_Buffers_bytes + node_memory_Cached_bytes", "legendFormat": "cached+buffers", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 11,
          "type": "stat",
          "title": "Available Memory",
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 15 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "node_memory_MemAvailable_bytes", "legendFormat": "available", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 12,
          "type": "row",
          "title": "Disk",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 19 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Root Filesystem Usage",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "node_filesystem_size_bytes{fstype=~\"ext4|xfs\",mountpoint=\"/\"} - node_filesystem_avail_bytes{fstype=~\"ext4|xfs\",mountpoint=\"/\"}", "legendFormat": "used", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Disk I/O (read/write bytes)",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 20 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(node_disk_read_bytes_total{device=~\"vd.*|nvme.*|sd.*\"}[5m])", "legendFormat": "read {{device}}", "refId": "A" },
            { "expr": "rate(node_disk_written_bytes_total{device=~\"vd.*|nvme.*|sd.*\"}[5m])", "legendFormat": "write {{device}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 15,
          "type": "row",
          "title": "Network & Processes",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 27 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 16,
          "type": "timeseries",
          "title": "Network RX / TX",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(node_network_receive_bytes_total{device=\"eth0\"}[5m])", "legendFormat": "RX", "refId": "A" },
            { "expr": "rate(node_network_transmit_bytes_total{device=\"eth0\"}[5m])", "legendFormat": "TX", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 17,
          "type": "timeseries",
          "title": "Network Errors & Drops",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 28 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(node_network_receive_errs_total[5m])", "legendFormat": "RX errs", "refId": "A" },
            { "expr": "rate(node_network_transmit_errs_total[5m])", "legendFormat": "TX errs", "refId": "B" },
            { "expr": "rate(node_network_receive_drop_total[5m])", "legendFormat": "RX drop", "refId": "C" },
            { "expr": "rate(node_network_transmit_drop_total[5m])", "legendFormat": "TX drop", "refId": "D" }
          ],
          "fieldConfig": { "defaults": { "unit": "pps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        }
      ]
    }

  application.json: |
    {
      "title": "DevShop Application / API",
      "uid": "devshop-application",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "application", "api"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "pod",
            "label": "Backend Pod",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_server_requests_seconds_count, pod)",
            "refresh": 1,
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Request Traffic",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Requests / sec",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count[5m]))", "legendFormat": "req/s", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 500 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Errors / sec (5xx)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m]))", "legendFormat": "5xx/s", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 2 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "4xx / sec",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{status=~\"4..\"}[5m]))", "legendFormat": "4xx/s", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 2 }, { "color": "red", "value": 10 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Error %",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(rate(http_server_requests_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 0.001) * 100", "legendFormat": "%", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 1 }, { "color": "red", "value": 5 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requests / sec by HTTP Status",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (status) (rate(http_server_requests_seconds_count[5m]))", "legendFormat": "{{status}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 7,
          "type": "row",
          "title": "Latency",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Latency Percentiles",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "histogram_quantile(0.50, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))", "legendFormat": "P50", "refId": "A" },
            { "expr": "histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))", "legendFormat": "P95", "refId": "B" },
            { "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket[5m])))", "legendFormat": "P99", "refId": "C" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Top Endpoints by Traffic",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "topk(10, sum by (uri) (rate(http_server_requests_seconds_count[5m])))", "legendFormat": "{{uri}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 10,
          "type": "row",
          "title": "JVM",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Heap Used vs Committed",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "jvm_memory_used_bytes{area=\"heap\"}", "legendFormat": "heap used", "refId": "A" },
            { "expr": "jvm_memory_committed_bytes{area=\"heap\"}", "legendFormat": "heap committed", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Heap Used",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{area=\"heap\"})", "legendFormat": "heap", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 734003200 }, { "color": "red", "value": 1048576000 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Non-Heap Used",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(jvm_memory_used_bytes{area=\"nonheap\"})", "legendFormat": "nonheap", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Threads",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 23 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "jvm_threads_live_threads", "legendFormat": "threads", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] },
