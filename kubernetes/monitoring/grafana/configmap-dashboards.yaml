  postgresql.json: |
    {
      "title": "DevShop PostgreSQL",
      "uid": "devshop-postgresql",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "postgresql", "database"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Database Status",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "PostgreSQL UP/DOWN",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "up{job=\"postgres-exporter\"}", "legendFormat": "status", "refId": "A" }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "green", "value": 1 } ] },
              "mappings": [ { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } } ]
            },
            "overrides": []
          },
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Active Connections",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_database_numbackends", "legendFormat": "conn", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 90 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Connection Utilisation %",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_database_numbackends / (pg_settings_max_connections / 1) * 100", "legendFormat": "%", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 60 }, { "color": "red", "value": 85 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Database Size",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_database_size_bytes", "legendFormat": "size", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Cache Hit Ratio %",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum(pg_stat_database_blks_hit) / (sum(pg_stat_database_blks_hit) + sum(pg_stat_database_blks_read)) * 100", "legendFormat": "%", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "max": 100, "min": 0, "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 95 }, { "color": "green", "value": 99 } ] } }, "overrides": [] },
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "center", "orientation": "auto", "textMode": "auto" }
        },
        {
          "id": 7,
          "type": "row",
          "title": "Transactions & Tuples",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Transactions / sec (commits + rollbacks)",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(pg_stat_database_xact_commit[5m])", "legendFormat": "commit/s", "refId": "A" },
            { "expr": "rate(pg_stat_database_xact_rollback[5m])", "legendFormat": "rollback/s", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Tuples Read / Written / Returned",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 6 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(pg_stat_database_tup_returned[5m])", "legendFormat": "returned/s", "refId": "A" },
            { "expr": "rate(pg_stat_database_tup_fetched[5m])", "legendFormat": "fetched/s", "refId": "B" },
            { "expr": "rate(pg_stat_database_tup_inserted[5m])", "legendFormat": "inserted/s", "refId": "C" },
            { "expr": "rate(pg_stat_database_tup_updated[5m])", "legendFormat": "updated/s", "refId": "D" },
            { "expr": "rate(pg_stat_database_tup_deleted[5m])", "legendFormat": "deleted/s", "refId": "E" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Locks & Health",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Active Backends / Max Connections",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_database_numbackends", "legendFormat": "active", "refId": "A" },
            { "expr": "pg_settings_max_connections", "legendFormat": "max", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Deadlocks & Locks Blocked",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_deadlocks_total", "legendFormat": "deadlocks", "refId": "A" },
            { "expr": "pg_locks_count", "legendFormat": "locks", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 500 } ] } }, "overrides": [] }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Replication (disabled for single instance - informational)",
          "gridPos": { "h": 5, "w": 24, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "pg_stat_replication_count", "legendFormat": "replicas (expected 0)", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        }
      ]
    }

  workloads.json: |
    {
      "title": "DevShop Kubernetes Workloads",
      "uid": "devshop-workloads",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "kubernetes", "workloads"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(kube_pod_info, namespace)",
            "refresh": 1,
            "includeAll": false
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "table",
          "title": "Deployment Replicas (Desired vs Available)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "(kube_deployment_status_replicas_available / kube_deployment_spec_replicas * 100)", "legendFormat": "availability %", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 80 }, { "color": "green", "value": 100 } ] },
              "unit": "percent",
              "custom": { "align": "auto", "filterable": false }
            },
            "overrides": []
          },
          "transformations": []
        },
        {
          "id": 2,
          "type": "table",
          "title": "Pod Status by Workload",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (namespace, pod, phase) (kube_pod_status_phase)", "legendFormat": "{{namespace}} {{pod}}", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": false } }, "overrides": [] },
          "transformations": []
        },
        {
          "id": 3,
          "type": "row",
          "title": "Backend",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 8 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backend Container CPU",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(container_cpu_usage_seconds_total{namespace=\"devshop\",container=\"backend\"}[5m]) * 100", "legendFormat": "{{pod}} cpu cores*100", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Backend Container Memory",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 9 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "container_memory_working_set_bytes{namespace=\"devshop\",container=\"backend\"}", "legendFormat": "{{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 6,
          "type": "row",
          "title": "Frontends & PostgreSQL",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 17 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Container CPU (all DevShop workloads)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",image!=\"\"}[5m]) * 100", "legendFormat": "{{container}} {{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Container Memory (all DevShop workloads)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 18 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "container_memory_working_set_bytes{namespace=~\"$namespace\",image!=\"\"}", "legendFormat": "{{container}} {{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "bytes", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 9,
          "type": "row",
          "title": "Restarts & Readiness",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Container Restarts",
          "gridPos": { "h": 7, "w": 12, "x": 0, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "rate(kube_pod_container_status_restarts_total[15m])", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.3 }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Network (RX/TX) per Pod",
          "gridPos": { "h": 7, "w": 12, "x": 12, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (pod) (rate(container_network_receive_bytes_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "RX {{pod}}", "refId": "A" },
            { "expr": "sum by (pod) (rate(container_network_transmit_bytes_total{namespace=~\"$namespace\"}[5m]))", "legendFormat": "TX {{pod}}", "refId": "B" }
          ],
          "fieldConfig": { "defaults": { "unit": "Bps", "color": { "mode": "palette-classic" } }, "overrides": [] }
        }
      ]
    }

  ci-cd.json: |
    {
      "title": "DevShop CI/CD & Deployment Health",
      "uid": "devshop-ci-cd",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["devshop", "ci-cd", "deployment"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "30s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "About this dashboard",
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "options": {
            "mode": "markdown",
            "content": "### CI/CD & Deployment Health\n\nThis dashboard shows the **deployed state** visible from Kubernetes itself (image tags, rollout/availability, pod age).\n\nJenkins runs the CI pipeline (builds images, pushes to Docker Hub, and writes the desired image tag back to Git). **Argo CD** syncs Kubernetes from Git. Neither Jenkins nor Argo CD currently expose Prometheus metrics in this project, so there is no direct build/sync chart here yet. When a metrics exporter is added for Argo CD (`argocd_app_info`, etc.) or Jenkins, add panels to those Prometheus series. The drill path for any problem below is: Open the **Application/API** dashboard, then **Workloads**, then drill to the node via the **Infrastructure** dashboard."
          }
        },
        {
          "id": 2,
          "type": "row",
          "title": "Deployment / Rollout State",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 4 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 3,
          "type": "table",
          "title": "Deployment Availability %",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "(kube_deployment_status_replicas_available / kube_deployment_spec_replicas * 100)", "legendFormat": "avail %", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [ { "color": "red", "value": null }, { "color": "yellow", "value": 80 }, { "color": "green", "value": 100 } ] },
              "custom": { "align": "auto", "filterable": false }
            },
            "overrides": []
          },
          "transformations": []
        },
        {
          "id": 4,
          "type": "table",
          "title": "Currently Deployed Image per Pod",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "kube_pod_container_info", "legendFormat": "{{pod}} {{image}}", "refId": "A", "format": "table", "instant": true }
          ],
          "fieldConfig": { "defaults": { "custom": { "align": "auto", "filterable": false } }, "overrides": [] },
          "transformations": []
        },
        {
          "id": 5,
          "type": "row",
          "title": "Rollout Stability",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "collapsed": false,
          "panels": []
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Pod Start Time (new deployments appear as fresh lines)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "time() - kube_pod_start_time", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "s", "color": { "mode": "palette-classic" } }, "overrides": [] }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Restarts since rollout",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            { "expr": "sum by (namespace, pod) (rate(kube_pod_container_status_restarts_total[5m]))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ],
          "fieldConfig": { "defaults": { "unit": "short", "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "yellow", "value": 0.2 }, { "color": "red", "value": 1 } ] } }, "overrides": [] }
        }
      ]
    }

