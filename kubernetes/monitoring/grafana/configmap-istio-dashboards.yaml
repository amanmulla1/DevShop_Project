# =============================================================================
# DevShop - Istio service-mesh Grafana dashboard (auto-provisioned)
#
# Reads istio_requests_* and istio_tcp_* telemetry collected by Prometheus from
# the Envoy sidecars. Deployed alongside the existing DevShop dashboards in the
# monitoring kustomization.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-istio-dashboard
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
data:
  istio-mesh.json: |
    {
      "title": "Istio Service Mesh",
      "uid": "istio-mesh",
      "version": 1,
      "schemaVersion": 40,
      "tags": ["istio", "mesh", "service-mesh"],
      "time": { "from": "now-15m", "to": "now" },
      "refresh": "15s",
      "timezone": "browser",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "sourceWorkloadNamespace",
            "label": "Source Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(istio_requests_total, source_workload_namespace)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*"
          },
          {
            "name": "destinationWorkloadNamespace",
            "label": "Destination Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(istio_requests_total, destination_workload_namespace)",
            "refresh": 1,
            "includeAll": true,
            "allValue": ".*"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Request Metrics",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Total Requests (5m)",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{source_workload_namespace=~\"$sourceWorkloadNamespace\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[5m]))",
              "legendFormat": "req/s",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": { "steps": [{ "color": "blue", "value": null }] }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Success Rate (5m)",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * sum(rate(istio_requests_total{response_code!~\"5.*\",source_workload_namespace=~\"$sourceWorkloadNamespace\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[5m])) / sum(rate(istio_requests_total{source_workload_namespace=~\"$sourceWorkloadNamespace\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[5m]))",
              "legendFormat": "% 2xx+3xx",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 99.5 }] }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "4xx/5xx Rate (5m)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "100 * sum(rate(istio_requests_total{response_code=~\"[45]..\",source_workload_namespace=~\"$sourceWorkloadNamespace\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[5m])) / sum(rate(istio_requests_total{source_workload_namespace=~\"$sourceWorkloadNamespace\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[5m]))",
              "legendFormat": "% err",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": { "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 1 }, { "color": "red", "value": 5 }] }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Active Connections (tcp)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(istio_tcp_connections_opened_total{source_workload_namespace=~\"$sourceWorkloadNamespace\"}) - sum(istio_tcp_connections_closed_total{source_workload_namespace=~\"$sourceWorkloadNamespace\"})",
              "legendFormat": "connections",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "thresholds": { "steps": [{ "color": "purple", "value": null }] } }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Requests Per Second by Source Workload",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{source_workload_namespace=~\"$sourceWorkloadNamespace\"}[1m])) by (source_workload)",
              "legendFormat": "{{source_workload}}",
              "refId": "A"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Latency P50/P90/P99 (by destination workload)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[1m])) by (le, destination_workload))",
              "legendFormat": "p50 {{destination_workload}}",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.90, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[1m])) by (le, destination_workload))",
              "legendFormat": "p90 {{destination_workload}}",
              "refId": "B"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[1m])) by (le, destination_workload))",
              "legendFormat": "p99 {{destination_workload}}",
              "refId": "C"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "TCP Connections Opened/Closed (by source)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 13 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_tcp_connections_opened_total{source_workload_namespace=~\"$sourceWorkloadNamespace\"}[1m])) by (source_workload)",
              "legendFormat": "opened {{source_workload}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(istio_tcp_connections_closed_total{source_workload_namespace=~\"$sourceWorkloadNamespace\"}[1m])) by (source_workload)",
              "legendFormat": "closed {{source_workload}}",
              "refId": "B"
            }
          ],
          "fieldConfig": { "defaults": { "unit": "cps" } }
        },
        {
          "id": 30,
          "type": "timeseries",
          "title": "Request Count by Response Code (destination)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 21 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"[2345]..\",destination_workload_namespace=~\"$destinationWorkloadNamespace\"}[1m])) by (response_code, destination_workload)",
              "legendFormat": "{{response_code}} {{destination_workload}}",
              "refId": "A"
            }
          ]
        }
      ],
      "schemaVersion": 40
    }
