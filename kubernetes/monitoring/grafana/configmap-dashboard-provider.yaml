# =============================================================================
# DevShop - Grafana dashboards provider provisioning
#
# Automatically provisions the DevShop dashboards into well-organised folders,
# each driven by a file in /var/lib/grafana/dashboards (mounted from the
# grafana-dashboards ConfigMap). No manual dashboard import is needed.
#
# Folders: DevShop/Overview, DevShop/Kubernetes, DevShop/Infrastructure,
#          DevShop/Application, DevShop/PostgreSQL, DevShop/Workloads,
#          DevShop/CI-CD
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'DevShop Overview'
        orgId: 1
        folder: 'DevShop/Overview'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/overview.json
      - name: 'DevShop Kubernetes'
        orgId: 1
        folder: 'DevShop/Kubernetes'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/kubernetes.json
      - name: 'DevShop Infrastructure'
        orgId: 1
        folder: 'DevShop/Infrastructure'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/infrastructure.json
      - name: 'DevShop Application'
        orgId: 1
        folder: 'DevShop/Application'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/application.json
      - name: 'DevShop PostgreSQL'
        orgId: 1
        folder: 'DevShop/PostgreSQL'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/postgresql.json
      - name: 'DevShop Workloads'
        orgId: 1
        folder: 'DevShop/Workloads'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/workloads.json
      - name: 'DevShop CI-CD'
        orgId: 1
        folder: 'DevShop/CI-CD'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards/ci-cd.json
