# =============================================================================
# DevShop - Grafana Service (internal ClusterIP)
#
# Grafana is reached only inside the cluster (not exposed publicly). Access the
# UI safely via port-forward:
#   kubectl -n monitoring port-forward svc/grafana 3000:3000
#   open http://localhost:3000
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app: grafana
    app.kubernetes.io/part-of: devshop
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
