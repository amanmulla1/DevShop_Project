# =============================================================================
# DevShop - Customer Frontend Service (internal ClusterIP)
#
# Reached by the Ingress at:  customer-frontend:80
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: devshop
  labels:
    app: customer-frontend
    app.kubernetes.io/part-of: devshop
spec:
  type: ClusterIP
  selector:
    app: customer-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
