# =============================================================================
# DevShop - Customer Frontend Deployment
#
# Runs the PREBUILT production Nginx image (no `npm run dev`). The image
# serves the built React app on port 80 and its Nginx reverse-proxies /api/*
# to the backend Service (backend:8080) inside the cluster - the browser only
# ever talks to the same origin via relative /api URLs.
#
# Image (registry + immutable tag) is injected via kustomization.yaml / the
# deploy script - no hard-coded build number here.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: devshop
  labels:
    app: customer-frontend
    app.kubernetes.io/part-of: devshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: customer-frontend
          image: amanmulla1/devshop-frontend:LATEST_TAG_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
