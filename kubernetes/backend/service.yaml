# =============================================================================
# DevShop - Backend Service (internal ClusterIP)
#
# Other workloads reach the backend at:  backend:8080  (Kubernetes DNS).
# The backend is NOT exposed directly to the Internet - traffic reaches it via
# the frontend Nginx reverse-proxies / the Ingress.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devshop
  labels:
    app: backend
    app.kubernetes.io/part-of: devshop
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
