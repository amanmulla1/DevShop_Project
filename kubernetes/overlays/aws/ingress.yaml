# =============================================================================
# DevShop - Ingress (NGINX Ingress Controller) - AWS overlay
#
# Standard Kubernetes NGINX Ingress Controller (open source, no paid AWS LB).
# Routes by HOST:
#   devshop.local        -> customer-frontend (ClusterIP :80)
#   devshop-admin.local  -> admin-frontend    (ClusterIP :80)
#
# About /api: each frontend's Nginx already reverse-proxies /api/* to the
# backend Service (backend:8080) inside the cluster. Keeping /api at the
# frontend preserves the existing architecture and keeps requests same-origin,
# so NO separate /api -> backend Ingress rule is needed.
#
# HOSTS ARE CONFIGURABLE (no hard-coded EC2 IP). For public access, set the
# host to your real domain(s) and add a DNS record (A/CNAME) to the node's
# public IP. Defaults to *.local hostnames for local testing via /etc/hosts.
# See kubernetes/README.md.
#
# CORS_ALLOWED_ORIGINS in the ConfigMap MUST match these hosts exactly.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devshop-ingress
  namespace: devshop
  annotations:
    # WEB is the default NGINX entrypoint; keep TLS off unless you add certs.
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  labels:
    app.kubernetes.io/part-of: devshop
spec:
  ingressClassName: nginx
  rules:
    - host: devshop.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-frontend
                port:
                  number: 80
    - host: devshop-admin.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 80
