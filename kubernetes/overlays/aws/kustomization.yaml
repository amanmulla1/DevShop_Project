# =============================================================================
# DevShop - Kustomize AWS overlay
#
# Layered on top of kubernetes/base:
#   - ../../base           : namespace, configmap, postgres, backend, frontends
#   - ingress.yaml         : NGINX Ingress (host-based, configurable hosts)
#   - hpa.yaml             : backend autoscaling (requires Metrics Server)
#
# Image tags are injected here. Jenkins/Argo CD update `newTag` below to the
# immutable BUILD_NUMBER (e.g. 42) during the GitOps flow, so no single build
# number is hard-coded anywhere.
#
# The Secret (devshop-secret) is intentionally NOT listed here: real secret
# values are never committed to Git. The Secret is created OUTSIDE the
# Kustomize/Argo CD path (see scripts/deploy.sh + README), so Argo CD neither
# manages nor prunes it. A committed template lives at secret.example.yaml.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml
  - hpa.yaml

# Jenkins / the GitOps flow rewrites newTag to the immutable build number.
images:
  - name: amanmulla1/devshop-backend
    newTag: latest
  - name: amanmulla1/devshop-frontend
    newTag: latest
  - name: amanmulla1/devshop-admin-frontend
    newTag: latest
