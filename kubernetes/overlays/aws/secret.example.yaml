# =============================================================================
# DevShop - AWS overlay Secret TEMPLATE (DO NOT COMMIT REAL VALUES)
#
# This is the source template for the real devshop-secret that lives in the
# `devshop` namespace. It is applied OUTSIDE the Kustomize/Argo CD path so that
# no real secret value is ever committed to Git or managed by Argo CD.
#
# To create the real secret (run on a machine with kubectl access to the
# cluster), from the repo root:
#
#   cp kubernetes/overlays/aws/secret.example.yaml /tmp/devshop-secret.yaml
#   # edit /tmp/devshop-secret.yaml: replace the BASE64 PLACEHOLDERS below with
#   # your real values, e.g.
#   #   echo -n 'your-real-value' | base64
#   kubectl create namespace devshop 2>/dev/null || true
#   kubectl apply -n devshop -f /tmp/devshop-secret.yaml
#   rm /tmp/devshop-secret.yaml
#
# NEVER commit DB_PASSWORD, JWT_SECRET or ADMIN_PASSWORD.
# JWT_SECRET must be >= 32 characters.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devshop-secret
  namespace: devshop
  labels:
    app.kubernetes.io/part-of: devshop
type: Opaque
data:
  # Replace the BASE64 PLACEHOLDERS below with your real values.
  DB_USERNAME: "ZGV2c2hvcA=="        # devshop
  DB_PASSWORD: "Y2hhbmdlLW1lLXBhc3N3b3Jk"         # change-me-password (PLACEHOLDER)
  JWT_SECRET:  "Y2hhbmdlLW1lLWp3dC1zZWNyZXQtbWluaW11bS0zMi1ieXRlcw=="  # PLACEHOLDER
  ADMIN_PASSWORD: "Y2hhbmdlLW1lLWFkbWluLXBhc3N3b3Jk"  # PLACEHOLDER
