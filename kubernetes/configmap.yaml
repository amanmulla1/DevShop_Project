# =============================================================================
# DevShop - ConfigMap (NON-SECRET configuration)
#
# Only non-sensitive values live here. Secrets (DB password, JWT secret, admin
# password) belong in the Kubernetes Secret - see secret.example.yaml.
#
# Database host inside Kubernetes is the Service DNS name `postgres`, NOT
# localhost and NOT any EC2 IP.
#
# CORS origins are host/domain based (no hard-coded EC2 IP). For a real domain
# or public IP, edit CORS_ALLOWED_ORIGINS here (or via an overlay) EXACTLY to
# the origins the browsers will use - do not enable a wildcard.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: devshop-config
  namespace: devshop
  labels:
    app.kubernetes.io/part-of: devshop
data:
  # --- Backend ---
  SERVER_PORT: "8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "devshop"
  TZ: "Asia/Kolkata"
  JPA_DDL_AUTO: "update"
  JWT_EXPIRATION_MS: "86400000"
  # Browser-facing origins the backend allows via CORS. Defaults to the
  # documented local test hosts used by kubernetes/ingress.yaml. Change for a
  # real domain/IP (e.g. https://shop.example.com,https://admin.example.com).
  CORS_ALLOWED_ORIGINS: "http://devshop.local,http://devshop-admin.local"
  ADMIN_EMAIL: "admin@ds.com"
  ADMIN_NAME: "DevShop Admin"
