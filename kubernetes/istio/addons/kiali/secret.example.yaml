# =============================================================================
# DevShop - Kiali admin credentials TEMPLATE (committed)
#
# The REAL secret is rendered by the Ansible bootstrap into secret.yaml here
# (git-ignored) from the kiali_admin_user / kiali_admin_password variables
# supplied via --extra-vars. Copy this file to secret.yaml ONLY for manual
# local testing - never commit the rendered values.
#
#   cp secret.example.yaml secret.yaml   # then edit the base64 values
#
# Reference in the Kiali Deployment: the `kiali` Secret must exist in the
# istio-system namespace before/with the Kiali Deployment so login auth works.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: kiali
  namespace: istio-system
  labels:
    app: kiali
    app.kubernetes.io/part-of: devshop
type: Opaque
data:
  username: YWRtaW4=        # admin
  passphrase: YWRtaW4=       # admin  (CHANGE THIS)
# =============================================================================
# Note: values above are base64("admin"). Swap in real values for a manual
# install. The Ansible flow always overwrites this file with generated secrets.
# =============================================================================