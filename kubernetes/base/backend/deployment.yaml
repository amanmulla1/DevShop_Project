# =============================================================================
# DevShop - Backend Deployment
#
# Runs the PREBUILT Spring Boot image produced by Jenkins/Docker Hub.
# Kubernetes does NOT build the application - it pulls the image. The exact
# image (registry + immutable BUILD_NUMBER tag) is injected via the Kustomize
# overlay so no single build number is hard-coded in the base.
#
# Non-secret config comes from the devshop-config ConfigMap; secrets (DB
# password, JWT secret, admin password) from the devshop-secret Secret. Secret
# is layered AFTER the ConfigMap so it wins on key collisions.
#
# Service DNS: other pods reach this backend at:  backend:8080
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: devshop
  labels:
    app: backend
    app.kubernetes.io/part-of: devshop
spec:
  # Single replica (small Free-Tier node). Scale via HPA / kubectl scale later.
  replicas: 1
  selector:
    matchLabels:
      app: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: amanmulla1/devshop-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: devshop-config
            - secretRef:
                name: devshop-secret
          resources:
            requests:
              cpu: 175m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
