# =============================================================================
# DevShop - Secret TEMPLATE (DO NOT COMMIT REAL VALUES)
#
# THIS FILE IS A SAFE TEMPLATE WITH PLACEHOLDER VALUES.
#
# To create the real secret in the Kubernetes cluster WITHOUT storing it in Git:
#
#   # 1. (optional) create a real secret file locally from this template:
#   cp kubernetes/base/secret.example.yaml kubernetes/overlays/aws/secret.yaml
#   # 2. replace DB_USERNAME, DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD below with
#   #    REAL values, base64-encoded, e.g.:
#   #      echo -n 'your-real-value' | base64
#   # 3. kubectl apply -k kubernetes/overlays/aws
#
# The real kubernetes/overlays/aws/secret.yaml is git-ignored (the AWS overlay
# kustomization lists it; the example is committed, the real one is not).
#
# NEVER put DB_PASSWORD, JWT_SECRET or ADMIN_PASSWORD in the ConfigMap or in Git.
# These values must be at least:
#   - JWT_SECRET    : >= 32 characters (backend rejects short secrets)
#   - ADMIN_PASSWORD: a strong password
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: devshop-secret
  namespace: devshop
  labels:
    app.kubernetes.io/part-of: devshop
type: Opaque
data:
  # Replace the BASE64 PLACEHOLDERS below with your real values.
  DB_USERNAME: "ZGV2c2hvcA=="        # devshop
  DB_PASSWORD: "Y2hhbmdlLW1lLXBhc3N3b3Jk"         # change-me-password (PLACEHOLDER)
  JWT_SECRET:  "Y2hhbmdlLW1lLWp3dC1zZWNyZXQtbWluaW11bS0zMi1ieXRlcw=="  # PLACEHOLDER
  ADMIN_PASSWORD: "Y2hhbmdlLW1lLWFkbWluLXBhc3N3b3Jk"  # PLACEHOLDER
