# =============================================================================
# DevShop - Admin Frontend Deployment
#
# Runs the PREBUILT production Nginx image (no Vite dev server). Serves the
# built admin React app on port 80; Nginx reverse-proxies /api/* to the backend
# Service (backend:8080). Same pattern as the customer frontend.
#
# Image (registry + immutable tag) is injected via the Kustomize overlay.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: devshop
  labels:
    app: admin-frontend
    app.kubernetes.io/part-of: devshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
        - name: admin-frontend
          image: amanmulla1/devshop-admin-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
