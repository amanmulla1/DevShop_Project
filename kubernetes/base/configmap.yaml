# =============================================================================
# DevShop - ConfigMap (NON-SECRET backend configuration)
#
# Only non-sensitive values live here. Secrets (DB_PASSWORD, JWT_SECRET,
# ADMIN_PASSWORD, DB_USERNAME) belong in the Kubernetes Secret - see
# secret.example.yaml. The Secret is layered with envFrom AFTER the ConfigMap,
# so Secret values win on key collisions.
#
# DB_HOST is the PostgreSQL Service DNS name `postgres` (Kubernetes internal),
# NOT localhost and NOT any EC2 IP.
#
# CORS_ALLOWED_ORIGINS uses host/domain based origins (no hard-coded EC2 IP).
# For a real domain or public IP, set these EXACTLY to the browser-facing
# origins (see kubernetes/README.md). Keep the two other env vars as-is.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: devshop-config
  namespace: devshop
  labels:
    app.kubernetes.io/part-of: devshop
data:
  # --- Backend ---
  SERVER_PORT: "8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "devshop"
  TZ: "Asia/Kolkata"
  JPA_DDL_AUTO: "update"
  JWT_EXPIRATION_MS: "86400000"
  # Browser-facing origins the backend allows via CORS. With the NGINX Ingress
  # the browser talks to a single external origin and /api is same-origin, so
  # keep these EXACTLY aligned to the Ingress hosts used in the AWS overlay.
  CORS_ALLOWED_ORIGINS: "http://devshop.local,http://devshop-admin.local"
  ADMIN_EMAIL: "admin@ds.com"
  ADMIN_NAME: "DevShop Admin"
