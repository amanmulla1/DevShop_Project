# =============================================================================
# DevShop - PostgreSQL Service (internal ClusterIP)
#
# Other workloads reach the database at: postgres:5432 (Kubernetes DNS).
# Not exposed publicly.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devshop
  labels:
    app: postgres
    app.kubernetes.io/part-of: devshop
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
