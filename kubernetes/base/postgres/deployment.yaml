# =============================================================================
# DevShop - PostgreSQL Deployment (single instance)
#
# Uses the official postgres:16 image (same as Docker Compose). No clustering /
# HA - a single replica is appropriate for this Free Tier learning project.
# Data persists via the postgres-pvc PersistentVolumeClaim.
#
# Credentials: POSTGRES_USER / POSTGRES_PASSWORD come from the devshop-secret
# Secret; the database name from the devshop-config ConfigMap. Not stored in Git.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: devshop
  labels:
    app: postgres
    app.kubernetes.io/part-of: devshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate  # single-instance database: one pod at a time
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - configMapRef:
                name: devshop-config
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: devshop-config
                  key: DB_NAME
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: devshop-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devshop-secret
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: PGTZ
              value: Asia/Kolkata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "devshop", "-d", "devshop"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "devshop", "-d", "devshop"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
