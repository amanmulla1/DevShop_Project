# =============================================================================
# DevShop Frontends (customer + admin) - SonarQube scanner configuration.
#
# Used by the Jenkins "SonarQube Analysis" stage (and local runs). This file
# configures ONE SonarQube project that analyses both TypeScript/React apps.
# The backend is analysed separately by the Maven sonar plugin (see
# application/backend/sonar-project.properties).
#
# The scanner runs its own unit tests (vitest) on the frontends; coverage
# (lcov.info) is optional — wire it up by adding @vitest/coverage-v8 and a
# `coverageThresholds` config, then uncomment sonar.javascript.lcov.reportPaths.
# =============================================================================
sonar.projectKey=devshop-frontends
sonar.projectName=DevShop Frontends
sonar.projectVersion=0.1.0

sonar.sources=application/frontend/src,application/admin-frontend/src

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.*,**/*.spec.*,**/test/**,**/__tests__/**

# sonar.javascript.lcov.reportPaths=application/frontend/coverage/lcov.info,application/admin-frontend/coverage/lcov.info

# Fail the build when the server-side Quality Gate goes red.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300