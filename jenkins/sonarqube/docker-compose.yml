services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Override the baked-in admin password on the FIRST logon:
      #   http://<host>:9000  (admin / admin) -> prompt to change it.
      # SERVER stays on the embedded H2 database (no PostgreSQL) for a
      # self-contained Free-Tier-friendly setup. Backup with the agent rules:
      #   docker run --volumes-from sonarqube -v $PWD:/backup alpine \
      #     tar czf /backup/sonarqube-data.tgz /opt/sonarqube/data
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmapfs=false"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs: